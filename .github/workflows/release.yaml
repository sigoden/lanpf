name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Check tag
        id: check-tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build --locked --release --target ${{ matrix.target }} -p lanpf
          else
            cargo build --locked --release --target ${{ matrix.target }} -p lanpf
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          name=lanpf-$tag-${{ matrix.target }}
          exe=target/${{ matrix.target }}/release/lanpf
          mkdir -p dist

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$exe.exe" dist/lanpf.exe
            (cd dist && 7z a "$name.zip" lanpf.exe)
            echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "$exe" dist/lanpf
            tar -C dist -czf "dist/$name.tar.gz" lanpf
            echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ steps.check-tag.outputs.prerelease }}
          files: ${{ steps.package.outputs.archive }}
